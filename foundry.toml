[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
botchain_mainnet = "${BOTCHAIN_MAINNET_RPC_URL}"

[etherscan]
botchain_mainnet = { key = "${BLOCKSCOUT_API_KEY}", url = "${BOTCHAIN_MAINNET_VERIFIER_URL}", chain = 677 }
