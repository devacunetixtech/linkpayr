name: Deploy LinkPayr contract to BOT Chain Testnet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkpayr-botchain-testnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: botchain-testnet
    env:
      BOTCHAIN_TESTNET_RPC_URL: https://rpc.bohr.life
      BOTCHAIN_TESTNET_VERIFIER_URL: https://scan.bohr.life/api/
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check deployment secrets
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "PRIVATE_KEY is not configured."; exit 1; }
          test -n "$BLOCKSCOUT_API_KEY" || { echo "BLOCKSCOUT_API_KEY is not configured."; exit 1; }
          [[ "$PRIVATE_KEY" == 0x* ]] || { echo "PRIVATE_KEY must start with 0x."; exit 1; }

      - name: Install contract dependencies
        run: forge install foundry-rs/forge-std --no-git

      - name: Run contract tests
        run: forge test -vvv

      - name: Deploy and verify
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          forge script script/DeployPayLink.s.sol:DeployPayLink \
            --rpc-url "$BOTCHAIN_TESTNET_RPC_URL" \
            --broadcast \
            --verify \
            --verifier blockscout \
            --verifier-url "$BOTCHAIN_TESTNET_VERIFIER_URL" \
            --etherscan-api-key "$BLOCKSCOUT_API_KEY" \
            --slow

      - name: Record deployed address
        run: |
          ADDRESS=$(jq -r '.transactions[] | select(.contractName == "PayLink") | .contractAddress' broadcast/DeployPayLink.s.sol/968/run-latest.json | tail -1)
          [[ "$ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "Could not read the deployed contract address."; exit 1; }
          printf '// Updated automatically by the verified testnet deployment workflow.\nexport const PAYLINK_TESTNET_ADDRESS = "%s" as const;\n' "$ADDRESS" > lib/deployment.ts
          mkdir -p deployments
          jq -n --arg address "$ADDRESS" --arg network "BOT Chain Testnet" --argjson chainId 968 --arg explorer "https://scan.bohr.life/address/$ADDRESS" '{network:$network,chainId:$chainId,address:$address,explorer:$explorer}' > deployments/botchain-testnet.json

      - name: Commit deployment record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deployment.ts deployments/botchain-testnet.json
          git commit -m "chore: record BOT Chain testnet deployment"
          git push
